<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WatchSend WebShare</title>
    <style>
        :root { --bg: #f4f6f8; --card: #ffffff; --text: #1c1b1f; --text-sec: #666; --primary: #388e3c; --primary-light: #c8e6c9; --border: #e0e0e0; --shadow: 0 4px 20px rgba(0,0,0,0.05); }
        @media (prefers-color-scheme: dark) { :root { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --text-sec: #aaa; --primary: #4caf50; --primary-light: #2c3e35; --border: #3e3e3e; --shadow: 0 4px 20px rgba(0,0,0,0.3); } }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 16px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; }
        .header h1 { color: var(--primary); font-size: 22px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .header-controls { display: flex; gap: 8px; align-items: center; }
        .lang-select { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; font-size: 13px; outline: none; cursor: pointer; }
        .clipboard-box { background: var(--card); padding: 8px 12px; border-radius: 20px; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow); cursor: pointer; border: 1px solid var(--border); font-size: 13px; transition: 0.2s; }
        .clipboard-box:active { transform: scale(0.95); }
        
        .tabs { display: flex; background: var(--card); border-radius: 12px; padding: 4px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .tab { flex: 1; text-align: center; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; color: var(--text-sec); transition: 0.3s; font-size: 14px; }
        .tab.active { background: var(--primary-light); color: var(--primary); }
        
        .card { background: var(--card); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); display: none; }
        .card.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .drop-zone { border: 2px dashed var(--primary); border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; background: var(--bg); transition: 0.3s; }
        .drop-zone.dragover { background: var(--primary-light); transform: scale(0.98); }
        .drop-zone h3 { font-size: 16px; margin-bottom: 8px; }
        .drop-zone p { font-size: 12px; color: var(--text-sec); }
        
        .file-item { display: flex; align-items: center; background: var(--bg); padding: 10px; border-radius: 10px; margin-top: 10px; border: 1px solid var(--border); }
        .file-icon { width: 36px; height: 36px; background: var(--primary-light); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-right: 12px; flex-shrink: 0; }
        .file-info { flex: 1; overflow: hidden; }
        .file-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-size { font-size: 12px; color: var(--text-sec); margin-top: 2px; }
        .progress-bar { width: 100%; height: 4px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.2s; }
        
        textarea { width: 100%; min-height: 120px; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); margin-bottom: 12px; font-size: 14px; resize: vertical; outline: none; }
        .btn { background: var(--primary); color: #fff; border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 14px; width: 100%; transition: 0.2s; }
        .btn:active { opacity: 0.8; transform: scale(0.98); }
        
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: #333; color: #fff; padding: 10px 20px; border-radius: 20px; opacity: 0; transition: 0.3s; pointer-events: none; font-size: 14px; z-index: 999; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>WatchSend</h1>
            <div class="header-controls">
                <select id="lang-select" class="lang-select" onchange="setLang(this.value)">
                    <option value="zh">简体中文</option>
                    <option value="zh_TW">繁體中文</option>
                    <option value="en">English</option>
                    <option value="ja">日本語</option>
                    <option value="ko">한국어</option>
                    <option value="de">Deutsch</option>
                    <option value="fr">Français</option>
                    <option value="es">Español</option>
                    <option value="ru">Русский</option>
                    <option value="pt">Português</option>
                </select>
                <div class="clipboard-box" onclick="syncClipboard()">
                    <span>📋</span>
                    <div id="clipboard-display" data-i18n="sync_clip" style="max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">同步手机剪贴板</div>
                </div>
            </div>
        </div>
        
        <div class="tabs">
            <div class="tab active" data-i18n="tab_send" onclick="switchTab('upload')">📤 发文件</div>
            <div class="tab" data-i18n="tab_recv" onclick="switchTab('download')">📥 收文件</div>
            <div class="tab" data-i18n="tab_text" onclick="switchTab('text')">📝 发文本</div>
        </div>

        <div id="tab-upload" class="card active">
            <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
                <h3 data-i18n="drop_title">点击 / 拖拽 / 粘贴文件</h3>
                <p data-i18n="drop_desc">支持多文件并发、文本自动转 TXT</p>
            </div>
            <input type="file" id="file-input" multiple style="display: none;" onchange="handleFiles(this.files)">
            <div id="upload-list"></div>
        </div>

        <div id="tab-download" class="card">
            <div id="download-list"><p style="text-align:center; color:var(--text-sec); font-size:14px;" data-i18n="loading_files">正在拉取文件列表...</p></div>
        </div>

        <div id="tab-text" class="card">
            <textarea id="text-input" data-i18n-placeholder="text_placeholder" placeholder="在此输入文本，点击发送后，文本将同步到手表剪贴板..."></textarea>
            <button class="btn" data-i18n="btn_send_text" onclick="sendText()">发送到手表</button>
        </div>
    </div>
    <div class="toast" id="toast"></div>

            de: { title: "WatchSend WebShare", sync_clip: "Handy-Zwischenablage synchronisieren", tab_send: "📤 Dateien senden", tab_recv: "📥 Dateien empfangen", tab_text: "📝 Text senden", drop_title: "Klicken / Ziehen / Einfügen", drop_desc: "Mehrere Dateien möglich, Text wird in TXT umgewandelt", loading_files: "Dateiliste wird abgerufen...", text_placeholder: "Text hier eingeben, klicken Sie auf Senden, um ihn in die Uhr-Zwischenablage zu kopieren...", btn_send_text: "An Uhr senden", phone_prefix: "Handy: ", msg_copied: "Handy-Zwischenablage kopiert", msg_clip_err: "Browser verweigert Zugriff auf Zwischenablage", msg_txt_to_file: "Text automatisch in TXT umgewandelt", msg_pasted: "Bild eingefügt", msg_all_done: "Alle Übertragungen abgeschlossen!", msg_no_files: "Keine Dateien auf der Uhr", msg_load_fail: "Laden fehlgeschlagen", msg_input_empty: "Bitte Text eingeben", msg_sent_to_watch: "An Uhr-Zwischenablage gesendet", msg_send_fail: "Senden fehlgeschlagen", msg_net_err: "Netzwerkfehler", btn_download: "Herunterladen", status_done: "✅ Fertig", status_fail: "❌ Fehler", status_err: "❌ Fehler" },
            fr: { title: "WatchSend WebShare", sync_clip: "Sync presse-papiers du téléphone", tab_send: "📤 Envoyer fichiers", tab_recv: "📥 Recevoir fichiers", tab_text: "📝 Envoyer texte", drop_title: "Cliquer / Glisser / Coller", drop_desc: "Multi-fichiers, texte converti en TXT", loading_files: "Récupération de la liste...", text_placeholder: "Saisissez du texte ici, cliquez sur envoyer pour le synchroniser avec la montre...", btn_send_text: "Envoyer à la montre", phone_prefix: "Tél : ", msg_copied: "Presse-papiers du téléphone copié", msg_clip_err: "Accès au presse-papiers refusé par le navigateur", msg_txt_to_file: "Texte converti en TXT", msg_pasted: "Image collée", msg_all_done: "Tous les transferts terminés !", msg_no_files: "Aucun fichier sur la montre", msg_load_fail: "Échec du chargement", msg_input_empty: "Veuillez saisir du texte", msg_sent_to_watch: "Envoyé au presse-papiers de la montre", msg_send_fail: "Échec de l'envoi", msg_net_err: "Erreur réseau", btn_download: "Télécharger", status_done: "✅ Terminé", status_fail: "❌ Échec", status_err: "❌ Erreur" },
            es: { title: "WatchSend WebShare", sync_clip: "Sincronizar portapapeles", tab_send: "📤 Enviar archivos", tab_recv: "📥 Recibir archivos", tab_text: "📝 Enviar texto", drop_title: "Clic / Arrastrar / Pegar", drop_desc: "Múltiples archivos, texto convertido a TXT", loading_files: "Obteniendo lista de archivos...", text_placeholder: "Escribe texto aquí, haz clic en enviar para sincronizar al portapapeles del reloj...", btn_send_text: "Enviar al reloj", phone_prefix: "Móvil: ", msg_copied: "Portapapeles del móvil copiado", msg_clip_err: "Navegador denegó acceso al portapapeles", msg_txt_to_file: "Texto convertido automáticamente a TXT", msg_pasted: "Imagen pegada", msg_all_done: "¡Todas las transferencias completadas!", msg_no_files: "No hay archivos en el reloj", msg_load_fail: "Error al cargar", msg_input_empty: "Por favor ingrese texto", msg_sent_to_watch: "Enviado al portapapeles del reloj", msg_send_fail: "Error al enviar", msg_net_err: "Error de red", btn_download: "Descargar", status_done: "✅ Hecho", status_fail: "❌ Fallido", status_err: "❌ Error" },
            ru: { title: "WatchSend WebShare", sync_clip: "Синхронизировать буфер обмена", tab_send: "📤 Отправить файлы", tab_recv: "📥 Получить файлы", tab_text: "📝 Отправить текст", drop_title: "Клик / Перетаскивание / Вставка", drop_desc: "Поддержка нескольких файлов, текст в TXT", loading_files: "Получение списка файлов...", text_placeholder: "Введите текст здесь, нажмите отправить, чтобы синхронизировать с буфером обмена часов...", btn_send_text: "Отправить на часы", phone_prefix: "Телефон: ", msg_copied: "Буфер обмена телефона скопирован", msg_clip_err: "Браузер запретил доступ к буферу обмена", msg_txt_to_file: "Текст преобразован в TXT", msg_pasted: "Изображение вставлено", msg_all_done: "Все передачи завершены!", msg_no_files: "На часах нет файлов", msg_load_fail: "Ошибка загрузки", msg_input_empty: "Пожалуйста, введите текст", msg_sent_to_watch: "Отправлено в буфер обмена часов", msg_send_fail: "Ошибка отправки", msg_net_err: "Ошибка сети", btn_download: "Скачать", status_done: "✅ Готово", status_fail: "❌ Ошибка", status_err: "❌ Ошибка" },
            pt: { title: "WatchSend WebShare", sync_clip: "Sincronizar área de transferência", tab_send: "📤 Enviar arquivos", tab_recv: "📥 Receber arquivos", tab_text: "📝 Enviar texto", drop_title: "Clique / Arraste / Cole", drop_desc: "Múltiplos arquivos, texto convertido para TXT", loading_files: "Obtendo lista de arquivos...", text_placeholder: "Digite o texto aqui, clique em enviar para sincronizar com a área de transferência do relógio...", btn_send_text: "Enviar para o relógio", phone_prefix: "Celular: ", msg_copied: "Área de transferência do celular copiada", msg_clip_err: "Navegador negou acesso à área de transferência", msg_txt_to_file: "Texto convertido em TXT", msg_pasted: "Imagem colada", msg_all_done: "Todas as transferências concluídas!", msg_no_files: "Nenhum arquivo no relógio", msg_load_fail: "Falha ao carregar", msg_input_empty: "Por favor insira o texto", msg_sent_to_watch: "Enviado para a área de transferência do relógio", msg_send_fail: "Falha ao enviar", msg_net_err: "Erro de rede", btn_download: "Baixar", status_done: "✅ Concluído", status_fail: "❌ Falhou", status_err: "❌ Erro" }
        };

        let curLang = 'zh';
        
        function t(key) {
            return i18n[curLang][key] || i18n.en[key] || key;
        }

        function setLang(lang) {
            if (!i18n[lang]) lang = 'en';
            curLang = lang;
            document.getElementById('lang-select').value = lang;
            document.title = t('title');
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.innerHTML = t(el.getAttribute('data-i18n'));
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
            });
        }

        // 初始化语言
        const navLang = (navigator.language || navigator.userLanguage).toLowerCase();
        if (navLang.includes('zh-tw') || navLang.includes('zh-hk')) setLang('zh_TW');
        else if (navLang.includes('zh')) setLang('zh');
        else if (navLang.includes('ja')) setLang('ja');
        else if (navLang.includes('ko')) setLang('ko');
        else if (navLang.includes('de')) setLang('de');
        else if (navLang.includes('fr')) setLang('fr');
        else if (navLang.includes('es')) setLang('es');
        else if (navLang.includes('ru')) setLang('ru');
        else if (navLang.includes('pt')) setLang('pt');
        else setLang('en');

        // ==================== 业务逻辑 ====================
        fetch('/web/info').then(r=>r.json()).then(d=>document.querySelector('.header h1').innerText = "WatchSend - " + d.alias).catch(()=>{});

        let lastClip = "";
        setInterval(() => {
            fetch('/web/clipboard').then(r=>r.text()).then(txt => {
                if (txt && txt !== "null" && txt !== lastClip) {
                    lastClip = txt;
                    const display = document.getElementById('clipboard-display');
                    display.setAttribute('data-i18n', '');
                    display.innerText = t('phone_prefix') + txt;
                }
            }).catch(()=>{});
        }, 3000);

        function syncClipboard() {
            if (lastClip) {
                navigator.clipboard.writeText(lastClip).then(()=>showToast(t('msg_copied'))).catch(()=>showToast(t('msg_clip_err')));
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
            document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
            document.querySelectorAll('.tab')[['upload','download','text'].indexOf(tab)].classList.add('active');
            document.getElementById('tab-'+tab).classList.add('active');
            if(tab==='download') loadFiles();
        }

        function showToast(msg) { 
            const t=document.getElementById('toast'); t.innerText=msg; t.classList.add('show'); 
            setTimeout(()=>t.classList.remove('show'),2000); 
        }

        const dropZone = document.getElementById('drop-zone');
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) { handleFiles(e.dataTransfer.files); return; }
            const text = e.dataTransfer.getData('text/plain');
            if (text) {
                const file = new File([text], "text_" + Date.now() + ".txt", {type: "text/plain"});
                handleFiles([file]);
                showToast(t('msg_txt_to_file'));
            }
        });

        document.addEventListener('paste', (e) => {
            const items = e.clipboardData.items;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    const file = items[i].getAsFile();
                    if(file) { handleFiles([file]); showToast(t('msg_pasted')); }
                }
            }
        });

        function getIcon(name) {
            name = name.toLowerCase();
            if (name.match(/\.(jpg|jpeg|png|gif|webp)$/)) return '🖼️';
            if (name.match(/\.(mp4|mkv|avi)$/)) return '🎬';
            if (name.match(/\.(mp3|wav|flac)$/)) return '🎵';
            if (name.match(/\.(zip|rar|7z)$/)) return '📦';
            if (name.match(/\.(apk)$/)) return '🤖';
            if (name.match(/\.(txt|md)$/)) return '📝';
            return '📄';
        }
        
        function formatSize(b) { 
            if(!b) return '0 B'; 
            let k=1024,s=['B','KB','MB','GB'],i=Math.floor(Math.log(b)/Math.log(k)); 
            return parseFloat((b/Math.pow(k,i)).toFixed(1))+' '+s[i]; 
        }

        async function handleFiles(files) {
            if(!files || files.length===0) return;
            const list = document.getElementById('upload-list');
            let index = 0;
            
            async function worker() {
                while(index < files.length) {
                    const i = index++;
                    const f = files[i];
                    const div = document.createElement('div'); div.className = 'file-item';
                    // 采用最稳妥的字符串 + 拼接
                    div.innerHTML = '<div class="file-icon">' + getIcon(f.name) + '</div>' +
                        '<div class="file-info">' +
                            '<div class="file-name">' + f.name + '</div>' +
                            '<div class="file-size">' + formatSize(f.size) + '</div>' +
                            '<div class="progress-bar"><div class="progress-fill" id="p-' + i + '"></div></div>' +
                        '</div>' +
                        '<div id="s-' + i + '" style="font-size:12px; font-weight:bold; color:var(--text-sec); margin-left:10px;">0%</div>';
                    
                    list.appendChild(div);
                    
                    await new Promise(resolve => {
                        const xhr = new XMLHttpRequest();
                        xhr.open('POST', '/web/upload?name=' + encodeURIComponent(f.name), true);
                        xhr.upload.onprogress = e => { 
                            if(e.lengthComputable) { 
                                const p = Math.round((e.loaded/e.total)*100); 
                                document.getElementById('p-'+i).style.width = p+'%'; 
                                document.getElementById('s-'+i).innerText = p+'%'; 
                            } 
                        };
                        xhr.onload = () => { document.getElementById('s-'+i).innerText = xhr.status===200 ? t('status_done') : t('status_fail'); resolve(); };
                        xhr.onerror = () => { document.getElementById('s-'+i).innerText = t('status_err'); resolve(); };
                        xhr.send(f);
                    });
                }
            }
            const ws = []; for(let w=0;w<Math.min(3, files.length);w++) ws.push(worker());
            await Promise.all(ws);
            showToast(t('msg_all_done'));
        }

        function loadFiles() {
            const list = document.getElementById('download-list');
            list.innerHTML = '<p style="text-align:center; color:var(--text-sec); font-size:14px;">' + t('loading_files') + '</p>';
            fetch('/web/files').then(r => {
                if (!r.ok) throw new Error("HTTP " + r.status);
                return r.json();
            }).then(data => {
                if(data.length===0) { list.innerHTML = '<p style="text-align:center; color:var(--text-sec); font-size:14px;">' + t('msg_no_files') + '</p>'; return; }
                list.innerHTML = '';
                data.forEach(f => {
                    const div = document.createElement('div'); div.className = 'file-item';
                    div.innerHTML = '<div class="file-icon">' + getIcon(f.name) + '</div>' +
                        '<div class="file-info">' +
                            '<div class="file-name">' + f.name + '</div>' +
                            '<div class="file-size">' + formatSize(f.size) + '</div>' +
                        '</div>' +
                        '<a href="/web/download?name=' + encodeURIComponent(f.name) + '" class="btn" style="width:auto; padding:6px 12px; text-decoration:none; flex-shrink:0;">' + t('btn_download') + '</a>';
                    list.appendChild(div);
                });
            }).catch(()=>{ list.innerHTML = '<p style="text-align:center; color:red;">' + t('msg_load_fail') + '</p>'; });
        }

        function sendText() {
            const text = document.getElementById('text-input').value;
            if(!text) return showToast(t('msg_input_empty'));
            fetch('/web/text', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) })
            .then(r => { if(r.ok) { showToast(t('msg_sent_to_watch')); document.getElementById('text-input').value = ''; } else showToast(t('msg_send_fail')); })
            .catch(()=>showToast(t('msg_net_err')));
        }
    </script>
</body>
</html>
