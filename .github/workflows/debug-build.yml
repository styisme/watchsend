name: Debug Build (Daily Testing)

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 1. 初始化 Android SDK (用 JDK 17 跑 sdkmanager)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-28 build-tools;28.0.3 platform-tools'

      # 2. 切换回 WatchSend 专属的 JDK 8
      - name: Set up JDK 8 Zulu
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
          java-package: jdk

      - name: Point JAVA_HOME to JDK 8
        run: |
          if [ -n "$JAVA_HOME_8_X64" ]; then
            echo "JAVA_HOME=$JAVA_HOME_8_X64" >> $GITHUB_ENV
          fi

      # 3. 配置 Gradle 5.6.4
      - name: Setup Gradle 5.6.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-5.6.4-bin.zip
          unzip -q gradle-5.6.4-bin.zip
          echo "$PWD/gradle-5.6.4/bin" >> $GITHUB_PATH

      # 4. 清理缓存并开始 Debug 编译
      - name: Clean stale caches
        run: |
          rm -rf ~/.gradle/caches/transforms-* || true
          rm -rf app/build build || true

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: watchsend-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Build Log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-build-log
          path: build.log
